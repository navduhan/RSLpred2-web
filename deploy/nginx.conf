map $request_method $rsl_predict_key { POST $binary_remote_addr; default ""; }
map $request_method $rsl_status_key { GET $binary_remote_addr; default ""; }
limit_req_zone $rsl_predict_key zone=rsl_predict:10m rate=1r/m;
limit_req_zone $binary_remote_addr zone=rsl_api:10m rate=10r/m;
limit_req_zone $rsl_status_key zone=rsl_status:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=rsl_conn:10m;

server {
    listen 3215;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 10s;
    keepalive_timeout 20s;
    limit_req_status 429;
    limit_conn_status 429;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 15s;
    proxy_read_timeout 30s;

    location = /api/predict {
        limit_conn rsl_conn 3;
        limit_req zone=rsl_predict burst=2 nodelay;
        limit_req zone=rsl_status burst=10 nodelay;
        proxy_pass http://app:3215;
    }

    location ~ ^/api/(accession|fasta-check)$ {
        limit_req zone=rsl_api burst=5 nodelay;
        limit_conn rsl_conn 5;
        proxy_pass http://app:3215;
    }

    location ^~ /download/ {
        limit_conn rsl_conn 1;
        limit_rate_after 10m;
        limit_rate 20m;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_pass http://app:3215;
    }

    location / {
        limit_conn rsl_conn 20;
        proxy_pass http://app:3215;
    }
}
